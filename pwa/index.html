<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RedditVault" />
  <meta name="theme-color" content="#1a0a2e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>RedditVault</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <div class="header">
    <div style="display:flex;align-items:baseline;gap:8px">
      <div class="logo">Reddit<span>Vault</span></div>
      <div id="app-version" style="font-size:11px;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-weight:400"></div>
    </div>
    <div id="header-actions"></div>
  </div>
  <div class="content" id="main-content"></div>
  <nav class="nav-bar">
    <button class="nav-item active" onclick="showPage('home')" id="nav-home">
      <span class="nav-icon">🏠</span><span>Home</span>
    </button>
    <button class="nav-item" onclick="showPage('browse')" id="nav-browse">
      <span class="nav-icon">🔍</span><span>Search</span>
    </button>
    <button class="nav-item" onclick="showPage('recent')" id="nav-recent">
      <span class="nav-icon">🕘</span><span>Recent</span>
    </button>
    <button class="nav-item" onclick="showPage('lists')" id="nav-lists">
      <span class="nav-icon">📋</span><span>Lists</span>
    </button>
    <button class="nav-item" onclick="showPage('settings')" id="nav-settings">
      <span class="nav-icon">⚙️</span><span>Settings</span>
    </button>
  </nav>
  <div class="toast-container" id="toasts"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
